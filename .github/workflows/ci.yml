name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  # Keep JavaScript actions on the newer runtime while project validation runs
  # on the same Node LTS major used by local CI.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NEXT_TELEMETRY_DISABLED: "1"

# Least privilege: every job's default token is read-only. Only the `validate`
# job opts into the elevated attestation permissions it needs, and those
# attestation/upload steps are additionally gated to non-pull_request events.
permissions:
  contents: read
  actions: read

jobs:
  provenance-gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install pnpm
        run: npm install -g pnpm@11.5.2

      - name: Report provenance runtime
        run: |
          node --version
          pnpm --version
          pnpm config get cache-dir

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate GitHub Actions provenance pins
        run: pnpm run ci:validate-provenance

  dependency-review:
    # Dependency review only works on public repositories and supported GHAS-backed
    # private repos. Skip unsupported private repos by default, with an explicit
    # opt-in knob for environments that enable the necessary GitHub features.
    if: github.event_name == 'pull_request' && (!github.event.repository.private || vars.ENABLE_DEPENDENCY_REVIEW == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  issue-theme-gates:
    needs: provenance-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install pnpm
        run: npm install -g pnpm@11.5.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate issue-theme gate taxonomy
        run: pnpm run ci:issue-theme-gates --assert-workflow

  validate:
    needs:
      - provenance-gate
      - issue-theme-gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: write
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/agentic
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://postgres:postgres@127.0.0.1:5432/agentic
      AGENTIC_ACCESS_KEY: ci-access-key
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install pnpm
        run: npm install -g pnpm@11.5.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint gate
        run: pnpm run lint

      - name: Run typecheck gate
        run: pnpm run typecheck

      - name: Run format gate
        run: pnpm run format:check

      - name: Check release context
        run: pnpm run release:check-context

      - name: Validate OSS ownership defaults
        run: pnpm run test:oss:ownership

      - name: Validate docs inventory
        run: |
          pnpm run docs:render
          pnpm run docs:validate

      - name: Create security artifact directories
        run: mkdir -p artifacts/security artifacts/build artifacts/compliance

      - name: Validate compliance registry references
        run: pnpm run compliance:validate-registry

      - name: Audit production dependencies
        run: pnpm run security:audit-runtime --minimum-severity moderate --report artifacts/security/runtime-audit-report.json

      - name: Validate migrations
        run: |
          pnpm run db:check-migrations
          pnpm run db:migrate
          pnpm run db:status --require-ready

      - name: Run governance simulation suite
        run: pnpm run governance:simulate

      - name: Run security regression suite
        run: pnpm run test:security:regression

      - name: Run unit and integration tests
        run: pnpm test

      - name: Validate feature capability contracts
        run: pnpm run test:smoke:capabilities

      - name: Validate architecture fitness
        run: pnpm run test:architecture:fitness

      - name: Validate parallel worktree ownership
        if: startsWith(github.head_ref, 'feat/parallel-') || startsWith(github.ref_name, 'feat/parallel-')
        run: pnpm run test:parallel-worktree:fitness

      - name: Validate performance fitness
        run: pnpm run test:performance:fitness

      - name: Run async execution smoke
        run: pnpm run test:smoke:observability

      - name: Build applications
        run: pnpm run build

      - name: Generate runtime SBOM
        run: pnpm run security:sbom --output artifacts/security/agentic-sbom.spdx.json

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        # Run the E2E stack (web + worker) against a single shared file-backed store,
        # the configuration these UI/async-loop specs are validated under. Postgres
        # parity is covered by the unit/integration suite. Both DATABASE_URL and the
        # Hyperdrive local connection string must be empty here: the web app's DB
        # resolver prefers the Hyperdrive binding (populated from
        # CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE by the OpenNext dev
        # integration), so leaving it set would point the web app at Postgres while the
        # worker stays file-backed — a split store where async goal jobs never complete.
        run: pnpm run test:e2e
        env:
          DATABASE_URL: ""
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ""

      - name: Build container image
        run: docker build --build-arg NODE_OPTIONS="$NODE_OPTIONS" -t agentic-ci:${{ github.sha }} .

      - name: Package deployable build artifacts
        run: |
          tar -czf artifacts/build/agentic-runtime-bundle.tgz \
            apps/web/.next \
            apps/web/package.json \
            apps/worker/package.json \
            package.json \
            pnpm-lock.yaml \
            packages \
            scripts
          docker save agentic-ci:${{ github.sha }} -o artifacts/build/agentic-image.tar

      - name: Collect compliance evidence bundle
        run: pnpm run security:collect-evidence --require-artifacts --output-dir artifacts/compliance

      - name: Upload supply-chain evidence
        if: github.event_name != 'pull_request' && vars.ENABLE_SUPPLY_CHAIN_ARTIFACT_UPLOAD == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentic-supply-chain-evidence
          path: |
            artifacts/security
            artifacts/build
            artifacts/compliance
          if-no-files-found: error
          retention-days: 7

      - name: Note pull request evidence upload skip
        if: github.event_name == 'pull_request'
        run: |
          echo "Generated supply-chain evidence locally for PR validation."
          echo "Skipping artifact upload on pull_request events to avoid quota-bound CI failures."

      - name: Attest supply-chain evidence
        if: github.event_name != 'pull_request' && (!github.event.repository.private || github.event.repository.owner.type == 'Organization' || vars.ENABLE_ATTESTATIONS == 'true')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/security/agentic-sbom.spdx.json
            artifacts/build/agentic-runtime-bundle.tgz
            artifacts/build/agentic-image.tar

      - name: Note attestation capability skip
        if: github.event_name != 'pull_request' && github.event.repository.private && github.event.repository.owner.type != 'Organization' && vars.ENABLE_ATTESTATIONS != 'true'
        run: |
          echo "Skipping provenance attestation in this repository context."
          echo "GitHub only supports attestations for public repos and supported organization-backed private repos by default."
